<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Bryan y Beatriz 💃</title>

<style>
body {
    margin: 0;
    height: 100vh;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #d9fdd3, #fff0f6);
    font-family: Arial, sans-serif;
}

.contenedor {
    text-align: center;
}

.chikorita {
    width: 220px;
    height: 220px;
    object-fit: contain;
}

h1 {
    color: #4caf50;
    font-size: 38px;
}

p {
    font-size: 20px;
}

button {
    padding: 15px 30px;
    font-size: 20px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    margin: 10px;
}

#si {
    background: #4caf50;
    color: white;
}

#no {
    background: #777;
    color: white;
    position: absolute;
}
</style>
</head>

<body>

<div class="contenedor">

    <img src="./DJ%20BRYAN%20FLOW.JPG.jpeg" class="chikorita">

    <h1>💃 ¿Bryan deja bailar a Beatriz? 💃</h1>

    <p>Di la verdad... 👀</p>

    <button id="si" onclick="aceptar()">Sí, la deja bailar 💃</button>

    <button id="no">No 😏</button>

</div>

<script>

const botonNo = document.getElementById("no");

function moverBoton() {

    const ancho = window.innerWidth - botonNo.offsetWidth;
    const alto = window.innerHeight - botonNo.offsetHeight;

    const x = Math.random() * ancho;
    const y = Math.random() * alto;

    botonNo.style.left = x + "px";
    botonNo.style.top = y + "px";
}

botonNo.addEventListener("mouseover", moverBoton);

botonNo.addEventListener("touchstart", moverBoton);

function aceptar() {

    document.body.innerHTML = `
        <div style="text-align:center; font-family:Arial;">

            <h1 style="color:#e91e63;">
                🤣💃 ¡NO MIENTAS, BRYAN! 💃🤣
            </h1>

            <p style="font-size:25px;">
                No mientas Bryan, no la dejas bailar
            </p>

            <p style="font-size:25px;">
                ¡Y encima la dejas muy cansada! 😭😂
            </p>

        </div>
    `;
}

</script>

</body>
</html>
